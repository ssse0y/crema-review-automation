<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; color: #202124; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { margin: 0 0 14px; color: #5f6368; font-size: 12px; line-height: 1.5; }
    label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; margin-bottom: 10px; border: 1px solid #dadce0; border-radius: 6px; padding: 8px; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 10px; background: #1a73e8; color: white; font-weight: 700; cursor: pointer; }
    .secondary { margin-bottom: 12px; background: #eef3fc; color: #174ea6; }
    .path { margin-bottom: 8px; padding: 9px; border-radius: 6px; background: #f1f3f4; font-size: 12px; line-height: 1.45; word-break: break-all; }
    details { margin: 0 0 14px; font-size: 12px; }
    summary { cursor: pointer; color: #1a73e8; font-weight: 700; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "▸"; display: inline-block; margin-right: 5px; transition: transform .15s ease; }
    details[open] summary::before { transform: rotate(90deg); }
    details ol { margin: 9px 0; padding-left: 22px; color: #5f6368; line-height: 1.55; }
    .settings { padding: 8px; background: #f1f3f4; color: #3c4043; }
    .hidden { display: none; }
    button:disabled { background: #9aa0a6; cursor: default; }
    #status { margin-top: 10px; min-height: 18px; font-size: 12px; color: #137333; }
  </style>
</head>
<body>
  <h1>크리마 적립금 지급</h1>
  <p>처음에는 Chrome 기본 다운로드 폴더에 저장됩니다. 다른 폴더에 모아두려면 아래의 수정 버튼을 눌러 폴더 이름을 입력하세요.</p>
  <div id="editArea">
    <label for="folder">캡처 하위 폴더</label>
    <input id="folder" value="" placeholder="예: 부정리뷰 또는 크리마/부정리뷰">
    <button id="save" class="secondary">저장하기</button>
  </div>
  <div id="savedArea" class="hidden">
    <label>캡처 저장 경로</label>
    <div id="savedPath" class="path"></div>
    <button id="edit" class="secondary">수정</button>
  </div>
  <details>
    <summary>Chrome 기본 다운로드 폴더 확인 방법</summary>
    <ol>
      <li>아래 버튼을 눌러 Chrome 다운로드 설정을 엽니다.</li>
      <li><code>위치</code> 항목에 표시된 폴더 경로를 확인합니다.</li>
      <li>경로를 바꾸려면 위치 옆의 <code>변경</code>을 누릅니다.</li>
    </ol>
    <button id="openDownloads" class="settings">다운로드 설정 열기</button>
  </details>
  <button id="run">적립금 지급</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
