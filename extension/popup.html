<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; color: #202124; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { margin: 0 0 14px; color: #5f6368; font-size: 12px; line-height: 1.5; }
    label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; margin-bottom: 10px; border: 1px solid #dadce0; border-radius: 6px; padding: 8px; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 10px; background: #1a73e8; color: white; font-weight: 700; cursor: pointer; }
    .secondary { margin-bottom: 12px; background: #eef3fc; color: #174ea6; }
    .path { margin-bottom: 8px; padding: 9px; border-radius: 6px; background: #f1f3f4; font-size: 12px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    details { margin: 0 0 14px; font-size: 12px; }
    summary { cursor: pointer; color: #1a73e8; font-weight: 700; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "▸"; display: inline-block; margin-right: 5px; transition: transform .15s ease; }
    details[open] summary::before { transform: rotate(90deg); }
    details ol { margin: 9px 0; padding-left: 22px; color: #5f6368; line-height: 1.55; }
    .settings { padding: 8px; background: #f1f3f4; color: #3c4043; }
    .link { color: #1967d2; text-decoration: none; }
    .hint { margin: -5px 0 9px; color: #5f6368; font-size: 11px; line-height: 1.4; }
    .inline-row { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
    .inline-row input, .inline-row .path { flex: 1; min-width: 0; margin-bottom: 0; }
    .compact { width: auto; flex: 0 0 auto; margin: 0; padding: 8px 11px; font-size: 12px; white-space: nowrap; }
    .hidden { display: none; }
    button:disabled { background: #9aa0a6; cursor: default; }
    #run { padding: 13px; background: #16a34a; font-size: 14px; box-shadow: 0 2px 5px rgba(22, 163, 74, .28); }
    #run:hover { background: #15803d; }
    #runResult { margin-top: 10px; font-size: 12px; line-height: 1.45; }
    #runResult.running { color: #5f6368; }
    #runResult.success { color: #137333; }
    #runResult.error { color: #b3261e; }
    #errorDetails { margin-top: 7px; color: #b3261e; }
    #errorDetails summary { color: #b3261e; }
    #errorText { margin: 7px 0 0; padding: 8px; border-radius: 6px; background: #fce8e6; color: #5f2120; white-space: pre-wrap; word-break: break-word; font-family: system-ui, sans-serif; font-size: 11px; }
    #status { margin-top: 10px; min-height: 18px; font-size: 12px; color: #137333; }
  </style>
</head>
<body>
  <h1>크리마 적립금 지급</h1>
  <p>처음에는 Chrome 기본 다운로드 폴더에 저장됩니다. 다른 폴더에 모아두려면 아래의 수정 버튼을 눌러 폴더 이름을 입력하세요.</p>
  <div id="editArea">
    <label for="folder">부정리뷰 캡처 저장 경로</label>
    <div class="inline-row">
      <input id="folder" value="" placeholder="예: 부정리뷰">
      <button id="save" class="secondary compact">저장</button>
    </div>
  </div>
  <div id="savedArea" class="hidden">
    <label>부정리뷰 캡처 저장 경로</label>
    <div class="inline-row">
      <div id="savedPath" class="path"></div>
      <button id="edit" class="secondary compact">수정</button>
    </div>
  </div>
  <details>
    <summary>Chrome 기본 다운로드 폴더 확인 방법</summary>
    <ol>
      <li>아래 버튼을 눌러 Chrome 다운로드 설정을 엽니다.</li>
      <li><code>위치</code> 항목에 표시된 폴더 경로를 확인합니다.</li>
      <li>경로를 바꾸려면 위치 옆의 <code>변경</code>을 누릅니다.</li>
    </ol>
    <button id="openDownloads" class="settings">다운로드 설정 열기</button>
  </details>
  <div id="sheetEditArea" class="sheet-feature">
    <label for="sheetUrl">부정리뷰 기록 링크</label>
    <div class="inline-row">
      <input id="sheetUrl" type="url" placeholder="Google 스프레드시트 주소">
      <button id="saveSheet" class="secondary compact">저장</button>
    </div>
    <label for="sheetTabName">시트 탭 이름 (선택)</label>
    <input id="sheetTabName" placeholder="예: 크리마 부정리뷰 모음">
  </div>
  <div id="sheetSavedArea" class="hidden sheet-feature">
    <label>부정리뷰 기록 링크</label>
    <div class="inline-row">
      <div class="path"><a id="savedSheetUrl" class="link" href="#">저장된 링크 열기</a></div>
      <button id="editSheet" class="secondary compact">수정</button>
    </div>
  </div>
  <details id="sheetAuth" class="sheet-feature">
    <summary>Google Sheets 권한 연결</summary>
    <label for="webAppUrl">Apps Script 배포 URL</label>
    <div class="inline-row">
      <input id="webAppUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
      <button id="saveWebAppUrl" class="secondary compact">저장</button>
    </div>
    <label for="sheetApiKey">연결 키</label>
    <div class="inline-row">
      <input id="sheetApiKey" type="password" placeholder="setupApiKey에서 발급한 키">
      <button id="saveApiKey" class="secondary compact">저장</button>
    </div>
    <div id="authState" class="hint"></div>
  </details>
  <button id="run">적립금 지급</button>
  <div id="runResult"></div>
  <details id="errorDetails" class="hidden">
    <summary>오류 원인 보기</summary>
    <div id="errorText"></div>
  </details>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
