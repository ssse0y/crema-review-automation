<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; color: #202124; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { margin: 0 0 14px; color: #5f6368; font-size: 12px; line-height: 1.5; }
    label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; margin-bottom: 12px; border: 1px solid #dadce0; border-radius: 6px; padding: 8px; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 11px; background: #1a73e8; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { background: #9aa0a6; cursor: default; }
    #status { margin-top: 10px; min-height: 18px; font-size: 12px; color: #137333; }
  </style>
</head>
<body>
  <h1>크리마 리뷰 자동화</h1>
  <p>캡처는 Chrome 다운로드 폴더 아래 지정한 하위 폴더에 저장됩니다. 현재는 실제 지급이 잠겨 있습니다.</p>
  <label for="folder">캡처 하위 폴더</label>
  <input id="folder" value="부정리뷰" placeholder="예: 크리마/부정리뷰">
  <button id="run">지금 점검 실행</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
